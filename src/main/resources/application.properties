server.port=8080

# ---- 事件流处理服务可配置项 ----
# 临时性失败的最大重试次数（总尝试次数 = maxRetries + 1）
event.stream.max-retries=3
# 首次重试退避，之后指数退避；单测可用 -Devent.stream.retry-backoff-base=5ms 调小
event.stream.retry-backoff-base=50ms
event.stream.retry-backoff-max=2s
# 本地状态目录：事件日志 journals/*.jsonl + checkpoints.properties
event.stream.state-dir=data/event-stream
